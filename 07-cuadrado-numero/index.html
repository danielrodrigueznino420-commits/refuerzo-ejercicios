<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuadrado de un número</title>
</head>
<body>
  <h1>Cuadrado de un número</h1>
  <div id="resultado"></div>

  <script>
    function calcularCuadrado() {
      const numero = Number(prompt('Ingrese un número:'));

      if (Number.isNaN(numero)) {
        document.getElementById('resultado').textContent = 'Ingrese un número válido.';
        return;
      }

      const cuadrado = numero * numero;

      document.getElementById('resultado').innerHTML = `
        Número ingresado: ${numero}<br>
        El cuadrado del número es: ${cuadrado}
      `;
    }

    calcularCuadrado();
  </script>
</body>
</html>
