<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Área de un triángulo</title>
</head>
<body>
  <h1>Área de un triángulo</h1>
  <div id="resultado"></div>

  <script>
    function calcularArea() {
      const base = Number(prompt('Ingrese la base del triángulo:'));
      const altura = Number(prompt('Ingrese la altura del triángulo:'));

      if (Number.isNaN(base) || Number.isNaN(altura)) {
        document.getElementById('resultado').textContent = 'Ingrese valores válidos.';
        return;
      }

      const area = (base * altura) / 2;

      document.getElementById('resultado').innerHTML = `
        La base es: ${base}<br>
        La altura es: ${altura}<br>
        El área del triángulo es: ${area}
      `;
    }

    calcularArea();
  </script>
</body>
</html>
