<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Área y perímetro de un rectángulo</title>
</head>
<body>
  <h1>Área y perímetro de un rectángulo</h1>
  <div id="resultado"></div>

  <script>
    function calcularAreaPerimetro() {
      const base = Number(prompt('Ingrese la base del rectángulo:'));
      const altura = Number(prompt('Ingrese la altura del rectángulo:'));

      if (Number.isNaN(base) || Number.isNaN(altura)) {
        document.getElementById('resultado').textContent = 'Ingrese valores válidos.';
        return;
      }

      const area = base * altura;
      const perimetro = 2 * (base + altura);

      document.getElementById('resultado').innerHTML = `
        Área: ${area}<br>
        Perímetro: ${perimetro}
      `;
    }

    calcularAreaPerimetro();
  </script>
</body>
</html>
